
services:
  boxbox:
    image: ghcr.io/jr4dh3y/boxbox:v0.3.0
    container_name: boxbox

    ports:
      - "8081:8080"

    environment:
      BOXBOX_JWT_SECRET: ${BOXBOX_JWT_SECRET:?Configure o segredo JWT}
      BOXBOX_USERS_admin: ${BOXBOX_USERS_admin:?Configure o hash da senha}

      PUID: "1000"
      PGID: "1000"

    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - /home:/srv/home
      - /mnt/midias:/mnt/midias:rslave
      - /opt/dockers/boxbox/data:/data

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
